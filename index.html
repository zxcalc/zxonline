<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TikZit</title>
    <script type="module">
      import { renderApp } from "./src/gui/App.tsx";
      window.addEventListener('load', () => {
        const container = document.getElementById("root");
        const initialContent = {
          config: { enableAnimations: true },
          document: `\\begin{tikzpicture}\n\\end{tikzpicture}`,
          styles: `\\tikzstyle{z}=[circle,fill={rgb,255: red,216; green,248; blue,216},minimum size=4pt,inner sep=0pt]
                    \\tikzstyle{x}=[circle,fill={rgb,255: red,221; green,165; blue,165},minimum size=4pt,inner sep=0pt]`,
          styleFile: "styles.tikzstyles",
        };
        renderApp(container, initialContent);
      });
    </script>
  </head>
  <body>
    <div id="root" style="width: 100%; height: 100%;"></div>
  </body>
</html>
